name: Prep document and adapters

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  document:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_portable_packaging.py
      - run: python -m pytest -q tests/test_structured_geometry.py
      - run: python -m pytest -q tests/test_structured_adoption.py -k mismatched_original
      - name: Surface input, process ownership and Tet10 geometry contracts
        run: python -m pytest -q tests/test_surface_tet.py tests/test_surface_tet_backend.py tests/test_tet10_geometry.py
      - name: Meshing criteria and minimum-edge contracts
        run: python -m pytest -q tests/test_meshing_criteria.py tests/test_minimum_size_audit.py tests/test_gmsh_criteria.py
      - name: Geometry-only inspection and evidence reader contracts
        run: python -m pytest -q tests/test_geometry_inspection.py tests/test_geometry_inspection_reader.py tests/test_geometry_features.py
      - run: python -m pytest tests/test_document_core.py tests/test_radioss_editing.py tests/test_project_roundtrip.py tests/test_cli_workflow.py tests/test_application_contracts.py tests/test_rad_provider.py tests/test_radioss_modeling.py tests/test_radioss_defaults.py tests/test_modeling_workflow.py tests/test_modeling_commands.py tests/test_condition_workflow.py tests/test_rad_display_units.py tests/test_analysis_cases.py tests/test_curve_csv.py tests/test_multiresource_commands.py tests/test_source_models.py tests/test_mixed_relations.py tests/test_prepared_replacement.py tests/test_projection_contract.py tests/test_instance_references.py tests/test_mesh_edit_candidates.py tests/test_node_moves.py tests/test_group_member_review.py tests/test_node_merge_orientation.py tests/test_node_merges.py tests/test_shell_normals.py tests/test_node_coalescence.py tests/test_card_text.py

  qt-document:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libegl1 libxcb-cursor0 libxkbcommon0 libfontconfig1
      - run: python -m pip install -e ".[gui,dev]"
      - name: Qt document flow
        # The opt-in settings path is also exercised through separate CLI processes.
        run: python -m pytest -q tests/test_settings_isolation.py
      - name: Read-only geometry feature review
        run: python -m pytest -q tests/test_geometry_features_ui.py
      - name: Qt document regression
        run: python -m pytest -vv tests/test_gui_document_flow.py tests/test_common_widgets.py tests/test_prep_presentation.py tests/test_curve_plot_scale.py tests/test_program_comparison.py tests/test_property_presentations.py tests/test_reference_adapters.py tests/test_modeling_ui.py tests/test_viewport_visibility.py tests/test_conditions_ui.py tests/test_collection_editors.py tests/test_numeric_units.py tests/test_native_units_ui.py tests/test_groups_ui.py tests/test_responsive_inspector.py tests/test_selection_menu.py tests/test_analysis_cases_ui.py tests/test_case_entrypoints.py tests/test_curve_workflow.py tests/test_viewport_scaling.py tests/test_part_property_refresh.py tests/test_node_moves_ui.py tests/test_group_member_review_ui.py tests/test_node_merges_ui.py tests/test_shell_normals_ui.py tests/test_node_coalescence_ui.py tests/test_tree_appearance.py tests/test_courant_workspace.py

  cad-worker:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libegl1 libxkbcommon0 libfontconfig1
      # OCP generates independent test CAD. Its VTK 9.3 requirement must not
      # constrain the product GUI environment (VTK 9.4+).
      - run: python -m pip install -e ".[cad,widgets,dev]" cadquery-ocp==7.8.1.1.post1
      - name: Require real SDKs
        run: python -c "import gmsh, OCP; gmsh.initialize(interruptible=False); gmsh.finalize()"
      - name: Real CAD worker and asset checks
        run: python -m pytest -q tests/test_structured_mesh.py tests/test_structured_adoption.py tests/test_structured_hex_adoption.py tests/test_structured_mesh_ui.py tests/test_structured_hex_ui.py
      - name: Existing CAD worker regression
        run: python -m pytest tests/test_gmsh_adapter.py tests/test_mesh_candidates.py tests/test_mesh_adoption.py tests/test_mesh_workflow_ui.py tests/test_external_mesh.py tests/test_external_mesh_sdk.py tests/test_external_mesh_ui.py tests/test_solidcraft_source.py
      - name: Prepared straight Tet10 native and shared import UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_prepared_tet10.py tests/test_prepared_tet10_ui.py
      - name: Actual criteria profile, SDK bounds and complete minimum-edge audit
        run: python -m pytest -q tests/test_gmsh_criteria.py -k persisted_profile_reaches_actual
      - name: Actual geometry-only CAD inspection
        run: python -m pytest -q tests/test_geometry_inspection.py -k actual_geometry_inspection

  live-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      CAELAB_LIVE_CAPTURE_DIR: ${{ github.workspace }}/automation-evidence/live
      CAELAB_MCP_CAPTURE_DIR: ${{ github.workspace }}/automation-evidence/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libglu1-mesa libgl1 libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libfontconfig1 fonts-noto-cjk
      # OCP is only a fixture generator; this automation window explicitly has no 3D viewer.
      - run: python -m pip install -e ".[widgets,cad,dev]" cadquery-ocp==7.8.1.1.post1
      - name: Install the official server SDK and published client separately
        run: |
          python -m venv "$RUNNER_TEMP/prep-mcp-server"
          "$RUNNER_TEMP/prep-mcp-server/bin/python" -m pip install mcp==2.3.0
          python -m venv "$RUNNER_TEMP/prep-mcp-client"
          "$RUNNER_TEMP/prep-mcp-client/bin/python" -m pip install fastmcp==3.4.11
          echo "CAELAB_MCP_PYTHON=$RUNNER_TEMP/prep-mcp-server/bin/python" >> "$GITHUB_ENV"
          echo "CAELAB_FASTMCP=$RUNNER_TEMP/prep-mcp-client/bin/fastmcp" >> "$GITHUB_ENV"
      - name: Require actual GUI, SDK and client dependencies
        run: |
          python -c "import gmsh, OCP, PySide6; gmsh.initialize(interruptible=False); gmsh.finalize()"
          "$CAELAB_MCP_PYTHON" -c "from mcp.server import MCPServer"
          "$RUNNER_TEMP/prep-mcp-client/bin/python" -c "from importlib.metadata import version; print('FastMCP', version('fastmcp'))"
      - name: Actual opened GUI, live IPC and published MCP client
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -ra tests/test_live_transport.py tests/test_live_gui.py tests/test_live_lifecycle_review.py tests/test_mcp_client.py --basetemp=automation-private-work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-automation-evidence
          # Never publish connection descriptors or the test work directory.
          path: automation-evidence/

  native-render:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: '1'
      CAELAB_TEST_NATIVE_RENDER: '1'
      CAELAB_NATIVE_RENDER_ARTIFACT_DIR: ${{ github.workspace }}/render-evidence
      CAELAB_CURVE_CAPTURE_DIR: ${{ github.workspace }}/render-evidence/curves
      CAELAB_RELATIONS_HOST_CAPTURE_DIR: ${{ github.workspace }}/render-evidence/relations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libglu1-mesa libgl1 libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libfontconfig1 fonts-noto-cjk
      - run: python -m pip install -e ".[gui,cad,dev]"
      - name: Require the XCB plugin and an actual X11 Qt window system
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess
          from PySide6.QtCore import QLibraryInfo
          plugin = Path(QLibraryInfo.path(QLibraryInfo.PluginsPath)) / "platforms/libqxcb.so"
          result = subprocess.run(["ldd", str(plugin)], capture_output=True, text=True)
          print(result.stdout, result.stderr, flush=True)
          assert result.returncode == 0 and "not found" not in result.stdout
          PYCODE
          QT_DEBUG_PLUGINS=1 xvfb-run -a -s "-screen 0 1920x1080x24" python -u -c 'from PySide6.QtWidgets import QApplication; app = QApplication([]); print(app.platformName(), app.primaryScreen().geometry(), flush=True); assert app.platformName() == "xcb"'
      - name: Actual Qt VTK rendering and picking
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -s tests/test_structured_mesh_native.py tests/test_structured_hex_native.py tests/test_group_member_review_native.py tests/test_node_merges_native.py tests/test_node_coalescence_native.py
      - name: Existing native rendering regression
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -s tests/test_native_render.py tests/test_case_entrypoints.py tests/test_curve_workflow.py tests/test_external_mesh_native.py tests/test_source_models_ui.py tests/test_prepared_replacement_ui.py tests/test_model_relations_host.py tests/test_large_integer_selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-render
          path: render-evidence/

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in a new environment and create a working document
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/*.whl
          wheel-check/bin/caelab-prep new --name "Wheel smoke" --mass Mg --length mm --time s --output wheel-check/smoke.caeprep
          wheel-check/bin/caelab-prep inspect wheel-check/smoke.caeprep
      - uses: actions/upload-artifact@v4
        with:
          name: caelab-prep-wheel
          path: dist/*.whl

  solver-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -e ".[cad,dev]" cadquery-ocp==7.8.1.1.post1
      - name: Obtain the pinned official OpenCourant release
        run: |
          curl --fail --location --retry 2 https://github.com/OpenCourant/OpenCourant/releases/download/latest-20261011/OpenCourant_linux64.zip --output opencourant.zip
          echo "6cb419677ca36d73acb96218cc0cf5e4f7d50494d9c7812ba27935e3c0f8ec94  opencourant.zip" | sha256sum --check
          unzip -q opencourant.zip -d solver
          chmod +x solver/OpenCourant/exec/*
      - name: Generated inputs and independent physical invariants
        run: |
          export OPENCOURANT_PATH="$PWD/solver/OpenCourant"
          export RAD_CFG_PATH="$OPENCOURANT_PATH/hm_cfg_files"
          export RAD_H3D_PATH="$OPENCOURANT_PATH/extlib/h3d/lib/linux64"
          export LD_LIBRARY_PATH="$OPENCOURANT_PATH/extlib/hm_reader/linux64:$RAD_H3D_PATH"
          export OMP_NUM_THREADS=1 OMP_STACKSIZE=400m
          export CAELAB_STARTER="$OPENCOURANT_PATH/exec/starter_linux64_gf"
          export CAELAB_ENGINE="$OPENCOURANT_PATH/exec/engine_linux64_gf"
          python -m pytest -q tests/test_solver_generation.py tests/test_analysis_cases_solver.py tests/test_external_mesh_solver.py tests/test_mixed_relations.py::test_actual_mixed_native_inputs --basetemp=solver-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-generation-evidence
          path: solver-evidence/

  structured-recipes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install gmsh==4.15.2
      - name: Run locked SDK recipes and independent geometry oracles
        run: python scripts/evaluation/structured_f2/verify_f2.py --recipe scripts/evaluation/structured_recipes.py --output structured-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-recipe-evidence
          path: structured-evidence/

  representative-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -e ".[cad,dev]" gmsh==4.15.2 cadquery-ocp==7.8.1.1.post1
      - name: Check independent native oracle and bounded process management
        run: python -m pytest -q tests/test_representative_native.py
      - name: Prepare the same public representative model through production APIs
        run: python scripts/evaluation/representative_native.py prepare --output representative-evidence
      - name: Obtain the pinned official OpenCourant release
        run: |
          curl --fail --location --retry 2 https://github.com/OpenCourant/OpenCourant/releases/download/latest-20261011/OpenCourant_linux64.zip --output opencourant.zip
          echo "6cb419677ca36d73acb96218cc0cf5e4f7d50494d9c7812ba27935e3c0f8ec94  opencourant.zip" | sha256sum --check
          unzip -q opencourant.zip -d solver
          chmod +x solver/OpenCourant/exec/*
      - name: Exact Engine and separate physical history with a 120 second native budget
        run: python scripts/evaluation/representative_native.py run --output representative-evidence --solver-root "$PWD/solver/OpenCourant" --budget 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-native-evidence
          # Includes public inputs and diagnostic outputs, never solver executables.
          path: representative-evidence/
