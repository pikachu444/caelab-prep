name: Prep document and adapters

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  document:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_document_core.py tests/test_radioss_editing.py tests/test_project_roundtrip.py tests/test_cli_workflow.py tests/test_application_contracts.py tests/test_rad_provider.py

  qt-document:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libegl1 libxcb-cursor0 libxkbcommon0 libfontconfig1
      - run: python -m pip install -e ".[gui,dev]"
      - name: Qt document flow
        run: python -m pytest -vv tests/test_gui_document_flow.py tests/test_common_widgets.py

  cad-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      # OCP generates independent test CAD. Its VTK 9.3 requirement must not
      # constrain the product GUI environment (VTK 9.4+).
      - run: python -m pip install -e ".[cad,dev]" cadquery-ocp==7.8.1.1.post1
      - name: Require real SDKs
        run: python -c "import gmsh, OCP; gmsh.initialize(interruptible=False); gmsh.finalize()"
      - name: Real CAD worker and asset checks
        run: python -m pytest tests/test_gmsh_adapter.py
