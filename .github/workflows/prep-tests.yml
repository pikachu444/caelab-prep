name: Prep document and adapters

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  document:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_document_core.py tests/test_radioss_editing.py tests/test_project_roundtrip.py tests/test_cli_workflow.py

  qt-and-cad:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libxcb-cursor0
      - run: python -m pip install -e ".[gui,cad,dev]" cadquery-ocp==7.8.1.1.post1
      - name: Qt document flow and real CAD worker
        run: python -m pytest tests/test_gui_document_flow.py tests/test_gmsh_adapter.py
