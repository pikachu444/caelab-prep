[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caelab-prep"
version = "0.1.0"
description = "Independent CAE document and command foundation with a native Radioss editor"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
widgets = ["PySide6>=6.6,<6.12; python_version < '3.12'", "PySide6>=6.6,<6.13; python_version >= '3.12'"]
gui = ["PySide6>=6.6,<6.12; python_version < '3.12'", "PySide6>=6.6,<6.13; python_version >= '3.12'", "vtk>=9.4,<10"]
cad = ["gmsh==4.15.2"]
dev = ["pytest>=8"]

[project.scripts]
caelab-prep = "caelab_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
